@keyframes pop{from{transform:scale(0)}}
@keyframes fade{from{opacity:0;transform:translateY(12px)}}
@keyframes nudge{0%,100%{transform:translateY(-3px)}50%{transform:translateY(6px)}}
@keyframes flow{to{background-position:-640px -320px}}
@keyframes paint-on{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes ring{from{transform:scale(.55);opacity:1}to{transform:scale(2.3);opacity:0}}
@keyframes toast-in{from{opacity:0;translate:0 26px;rotate:-2deg}}
@keyframes cell-in{from{opacity:0;translate:0 14px}}
@keyframes cycle{
0%,5%{background-color:#FF051F}
8.33%,13.33%{background-color:#FF6B04}
16.67%,21.67%{background-color:#FEA005}
25%,30%{background-color:#FFE208}
33.33%,38.33%{background-color:#C8FF09}
41.67%,46.67%{background-color:#0AFF57}
50%,55%{background-color:#0BFFE1}
58.33%,63.33%{background-color:#07BEFF}
66.67%,71.67%{background-color:#043ECD}
75%,80%{background-color:#7405FE}
83.33%,88.33%{background-color:#E206FE}
91.67%,96.67%{background-color:#FF0598}
100%{background-color:#FF051F}
}

.site{position:relative;isolation:isolate;height:100%;background-color:var(--ambient,var(--canvas));transition:background-color .7s ease}
.site::before{content:"";position:fixed;inset:0;z-index:0;background-image:url(assets/canvas-2x.webp);background-image:image-set(url(assets/canvas-1x.webp) 1x,url(assets/canvas-2x.webp) 2x);background-size:256px 256px;mix-blend-mode:multiply;pointer-events:none}

/* the deck: every page sits in the same place, and only the active one is shown */
.deck{position:relative;z-index:1;height:100%;overflow:hidden}
.page{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;outline:none;opacity:0;visibility:hidden;scale:1.04;transition:opacity .7s ease,scale 1s var(--ease),visibility 0s linear 1s}
.page.is-past{scale:.96}
.page.is-active{opacity:1;visibility:visible;scale:1;transition:opacity .9s ease .15s,scale 1.1s var(--ease) .15s,visibility 0s}
.deck.no-anim .page{transition:none}

/* page 1: hero */
.hero{position:relative;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-block:96px 150px;padding-left:var(--gl);padding-right:var(--gr);overflow:hidden}
.title{position:relative;z-index:2;margin:0;font-size:clamp(52px,11vw,200px);line-height:.9;font-weight:800;letter-spacing:-.05em;text-align:center;text-wrap:balance}
.word{display:inline-block;padding:0 .02em;animation:rise 1.1s cubic-bezier(.16,1,.3,1) both}
.ink-paint{background-color:#141418;background-image:url(assets/paint-2x.webp);background-image:image-set(url(assets/paint-1x.webp) 1x,url(assets/paint-2x.webp) 2x);background-size:320px 320px;background-blend-mode:hard-light;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.swirl{background:url(assets/swirl.webp) 0 0/640px 320px repeat;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:rise 1.1s cubic-bezier(.16,1,.3,1) both,flow 26s linear infinite}
.w1{animation-delay:.95s}
.w2{animation-delay:1.07s}
.w3{animation-delay:1.19s}
.dot{display:inline-block;width:.17em;height:.17em;margin-left:.05em;border-radius:50%;background:#FF051F;animation:pop .8s cubic-bezier(.34,1.56,.64,1) 1.65s both,cycle 16s linear 1.65s infinite}
.stroke{position:absolute;z-index:1;display:block;max-width:100%;aspect-ratio:1400/380;background:var(--stroke-img) center/100% 100% no-repeat,var(--sc);background-blend-mode:hard-light;-webkit-mask:var(--stroke-img) center/100% 100% no-repeat;mask:var(--stroke-img) center/100% 100% no-repeat;pointer-events:none;animation:paint-on .9s cubic-bezier(.65,0,.2,1) both}
.s1{--sc:#043ECD;width:clamp(260px,42vw,620px);left:-3%;bottom:8%;rotate:-9deg;animation-delay:2.05s}
.s2{--sc:#FF0598;width:clamp(200px,31vw,460px);right:-2%;top:10%;rotate:7deg;animation-delay:2.25s}
.s3{--sc:#FFE208;width:clamp(140px,19vw,290px);right:12%;bottom:20%;rotate:-4deg;animation-delay:2.45s}
.curtain{position:absolute;inset:0;z-index:5;display:flex;align-items:flex-end;pointer-events:none}
.bar{flex:1 1 0;height:14px;background-color:var(--bc);background-image:url(assets/paint-2x.webp);background-image:image-set(url(assets/paint-1x.webp) 1x,url(assets/paint-2x.webp) 2x);background-size:384px 384px;background-blend-mode:hard-light;animation:curtain 1.15s cubic-bezier(.77,0,.18,1) both}
.bar:nth-child(2n){background-position:-140px -60px}
.bar:nth-child(3n){background-position:-300px -210px}
.cue-row{position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;justify-content:center;animation:fade .9s cubic-bezier(.16,1,.3,1) 2.6s both}
.cue{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;color:var(--ink);text-decoration:none;transition:color .25s ease}
.cue:hover{color:var(--cobalt)}
.cue svg{display:block;width:34px;height:34px;animation:nudge 1.6s ease-in-out infinite}

/* page 2: palette */
.page-pal{background-color:var(--ambient,var(--canvas));background-image:url(assets/canvas-2x.webp);background-image:image-set(url(assets/canvas-1x.webp) 1x,url(assets/canvas-2x.webp) 2x);background-size:256px 256px;background-blend-mode:multiply;transition:opacity .7s ease,scale 1s var(--ease),visibility 0s linear 1s,background-color .7s ease}
.page-pal.is-active{transition:opacity .9s ease .15s,scale 1.1s var(--ease) .15s,visibility 0s,background-color .7s ease}
.pal{position:relative;height:100%;min-height:520px;overflow:hidden}
.splat{position:absolute;z-index:0;display:block;max-width:100%;aspect-ratio:1/1;background-color:var(--sc);-webkit-mask:var(--splat-img) center/contain no-repeat;mask:var(--splat-img) center/contain no-repeat;pointer-events:none}
.sp1{--sc:#FF0598;width:min(44vw,640px);right:-9vw;top:-17vh;rotate:24deg}
.sp2{--sc:#111114;width:min(38vw,560px);right:3vw;bottom:-25vh;rotate:-40deg}
.sp3{--sc:#FFE208;width:min(22vw,320px);left:28vw;top:-8vh;rotate:70deg}
.mural{position:absolute;z-index:1;left:50%;top:51%;width:100vw;height:56vh;translate:-50% -50%;rotate:5deg}
.pal-title{position:absolute;z-index:3;left:var(--gl);top:12vh;margin:0;font-size:clamp(64px,11vw,200px);line-height:.8;font-weight:800;letter-spacing:-.06em;white-space:nowrap;color:#FFFFFF;mix-blend-mode:difference;pointer-events:none}
.readout{--rc:#043ECD;--ri:#FFFFFF;position:absolute;z-index:4;right:calc(var(--gr) + 1vw);top:7vh;rotate:-4deg;display:flex;align-items:center;min-width:320px;height:96px;box-sizing:border-box;padding:0 70px 0 44px;pointer-events:none}
.readout-paint{position:absolute;inset:-4px -8px;background:var(--stroke-img) center/100% 100% no-repeat,var(--rc);background-blend-mode:hard-light;-webkit-mask:var(--stroke-img) center/100% 100% no-repeat;mask:var(--stroke-img) center/100% 100% no-repeat;transition:background-color .45s ease}
.readout-copy{position:relative;display:flex;align-items:baseline;gap:14px;white-space:nowrap;color:var(--ri);transition:color .45s ease}
.readout-name{font:400 40px/1 var(--brush)}
.readout-sub{font:500 13px/1 var(--mono)}

.grid{display:grid;grid-auto-flow:column;grid-template-columns:1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr 1fr 1fr 1fr;width:100%;height:100%;transition:grid-template-columns .65s var(--ease),grid-template-rows .65s var(--ease)}
.sw{position:relative;display:block;min-width:0;min-height:0;margin:0;padding:0;border:0;border-radius:0;overflow:visible;translate:0 var(--offy);background-color:var(--c);background-image:url(assets/paint-2x.webp);background-image:image-set(url(assets/paint-1x.webp) 1x,url(assets/paint-2x.webp) 2x);background-size:384px 384px;background-position:var(--tx) var(--ty);background-blend-mode:hard-light;font:inherit;color:var(--on);text-align:left;text-decoration:none;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent;transition:background-position 1.4s var(--ease),box-shadow .3s ease}
.page.is-active .sw{animation:cell-in .7s var(--ease) both;animation-delay:var(--d)}
.sw.is-on{background-position:calc(var(--tx) - 64px) calc(var(--ty) - 28px);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--on) 45%,transparent)}
.sw:focus-visible{box-shadow:inset 0 0 0 3px var(--on)}
.sw-tag{position:absolute;top:12px;right:14px;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;opacity:0;transition:opacity .25s ease;pointer-events:none}
.sw-lbl{position:absolute;left:14px;right:14px;bottom:12px;display:flex;flex-direction:column;gap:6px;opacity:0;translate:0 8px;transition:opacity .25s ease,translate .5s var(--ease);pointer-events:none}
.sw-name{font:400 clamp(20px,2.4vw,34px)/1 var(--brush);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw-hex{font:500 13px/1 var(--mono);letter-spacing:.04em}
.sw.is-on .sw-lbl{opacity:1;translate:0 0;transition-delay:.12s}
.sw.is-on .sw-tag{opacity:1;transition-delay:.12s}
.sw.is-on .sw-name{animation:paint-on .55s cubic-bezier(.65,0,.2,1) .12s both}
.sw-live{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:#FFFFFF;transition:opacity .2s ease}
.sw-live::after{content:"";position:absolute;inset:-5px;border:1.5px solid #FFFFFF;border-radius:50%;animation:ring 1.8s ease-out infinite}
.sw.is-on .sw-live{opacity:0}
.sw.drip::before,.sw.drip::after{content:"";position:absolute;top:calc(100% - 1px);background-color:var(--c);background-image:url(assets/paint-2x.webp);background-image:image-set(url(assets/paint-1x.webp) 1x,url(assets/paint-2x.webp) 2x);background-size:384px 384px;background-position:var(--tx) var(--ty);background-blend-mode:hard-light;border-radius:0 0 999px 999px;pointer-events:none}
.sw.drip::before{left:var(--d1x);width:var(--d1w);height:var(--d1h)}
.sw.drip::after{left:var(--d2x);width:var(--d2w);height:var(--d2h)}

.foot{position:absolute;z-index:4;left:var(--gl);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.mark{font-size:20px;font-weight:800;letter-spacing:-.035em;color:var(--ink);text-decoration:none}
.mark .dot{animation-delay:.3s,.3s}
.legal{font:400 13px/1.4 var(--mono);color:var(--ink-soft)}

/* inquiries: a small note in the corner, on both pages */
.contact{position:fixed;z-index:50;right:var(--gr);bottom:calc(18px + env(safe-area-inset-bottom,0px));padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--canvas) 86%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font:400 13px/1.2 var(--mono);color:var(--ink);text-decoration:none;animation:fade .9s cubic-bezier(.16,1,.3,1) 2.6s both;transition:color .25s ease}
.contact:hover{color:var(--cobalt)}

/* the note shown for colors that are not open yet */
.toast-dock{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;box-sizing:border-box;padding-block:0 calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
/* always one line: --fit shrinks the whole note, type and paint together, until it fits the screen */
.toast{--tc:#FF051F;--ti:#000000;--fit:1;position:relative;flex:none;display:flex;flex-wrap:nowrap;align-items:center;gap:calc(20px * var(--fit));padding:calc(24px * var(--fit)) calc(56px * var(--fit)) calc(28px * var(--fit)) calc(46px * var(--fit));white-space:nowrap;pointer-events:auto;filter:drop-shadow(0 10px 14px rgba(17,17,20,.2))}
.toast-paint{position:absolute;inset:0;background:var(--stroke-img) center/100% 100% no-repeat,var(--tc);background-blend-mode:hard-light;-webkit-mask:var(--stroke-img) center/100% 100% no-repeat;mask:var(--stroke-img) center/100% 100% no-repeat}
.toast-msg{position:relative;font:400 calc(34px * var(--fit))/1.1 var(--brush);color:var(--ti)}
.go{position:relative;flex:none;display:inline-flex;align-items:center;min-height:calc(54px * var(--fit));box-sizing:border-box;padding:0 calc(32px * var(--fit)) 0 calc(22px * var(--fit));color:#FFFFFF;text-decoration:none}
.go::after{content:"";position:absolute;inset:-10px -6px}
.go:hover{color:#FFFFFF}
.go-paint{position:absolute;inset:0;background:var(--stroke-img) center/100% 100% no-repeat,var(--cobalt);background-blend-mode:hard-light;-webkit-mask:var(--stroke-img) center/100% 100% no-repeat;mask:var(--stroke-img) center/100% 100% no-repeat;transition:background-color .25s ease}
.go:hover .go-paint{background-color:var(--cobalt-deep)}
.go-text{position:relative;font:400 calc(27px * var(--fit))/1 var(--brush)}
.toast.play{animation:toast-in .5s cubic-bezier(.2,.9,.3,1.2) both}
.toast.play .toast-paint{animation:paint-on .55s cubic-bezier(.65,0,.2,1) both}
.toast.play .toast-msg{animation:fade .5s ease .25s both}
.toast.play .go{animation:fade .5s ease .4s both}

@media (min-width:721px) and (max-width:1099px){
  .readout{display:none}
}
@media (max-width:720px){
  .mural{width:min(84vw,30vh);height:min(168vw,60vh);top:56%;rotate:3deg}

  .sw{translate:var(--offx) 0}

  .sw-lbl,.sw-tag{display:none}
  .pal-title{font-size:15vw;top:max(5vh,46px)}
  .readout{display:none}
  .sp1{width:72vw;right:-24vw;top:-9vh}
  .sp2{width:62vw;right:-16vw;bottom:-16vh}
  .sp3{width:40vw;left:52vw;top:-6vh}

  .contact{top:calc(10px + env(safe-area-inset-top,0px));bottom:auto;padding:5px 10px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

    ['lilac','#F8C6FF','#000','#FAEFFB'], ['orchid','#F197FF','#000','#F9E5FC'], ['heliotrope','#E864FD','#000','#F8DCFD'], ['fuchsia','#E206FE','#000','#F9D4FE'], ['amethyst','#B416CA','#FFF','#EDD0F2'], ['plum','#810D92','#FFF','#E1CAE4'],
    ['petal','#FFC7DB','#000','#FCEFF3'], ['bubblegum','#FF99C2','#000','#FDE5ED'], ['flamingo','#FD66AB','#000','#FFDBE8'], ['hot pink','#FF0598','#000','#FFD3E4'], ['raspberry','#CA1479','#FFF','#F6CEDC'], ['mulberry','#910B55','#FFF','#E8C8D3']
  ];
  var COBALT = 52;
  var site = document.getElementById('site');
  var grid = document.getElementById('grid');
  var readout = document.getElementById('readout');
  var rName = document.getElementById('readout-name');
  var rSub = document.getElementById('readout-sub');
  var toast = document.getElementById('toast');
  var toastName = document.getElementById('toast-name');
  var ink = function (p) { return p[2] === '#000' ? '#000000' : '#FFFFFF'; };
  var STAGGER = [-2.6, 1.4, -1.2, 3.0, 0.4, -3.0, 2.0, -1.6, 3.4, -0.6, 2.4, -2.0];
  var rand = function (a, b) { var x = Math.sin((a + 1) * 12.9898 + b * 78.233) * 43758.5453; return x - Math.floor(x); };

  P.forEach(function (p, i) {
    var open = i === COBALT;
    var el = document.createElement(open ? 'a' : 'button');
    if (open) { el.href = 'cobalt.html'; } else { el.type = 'button'; }
    el.className = 'sw';
    el.dataset.i = String(i);
    el.style.setProperty('--c', p[1]);
    el.style.setProperty('--on', ink(p));
    el.style.setProperty('--tx', -((i * 97) % 384) + 'px');
    el.style.setProperty('--ty', -((i * 53) % 384) + 'px');
    el.style.setProperty('--d', (250 + (Math.floor(i / 6) + (i % 6)) * 22) + 'ms');
    // each color family hangs at its own height, and the darkest tone of each family drips
    var fam = Math.floor(i / 6);
    el.style.setProperty('--offy', (STAGGER[fam] * 0.9).toFixed(2) + 'vh');
    el.style.setProperty('--offx', (STAGGER[fam] * 0.9).toFixed(2) + 'vw');
    if (i % 6 === 5) {
      el.classList.add('drip');
      el.style.setProperty('--d1x', (12 + rand(fam, 1) * 38).toFixed(1) + '%');
      el.style.setProperty('--d1w', (10 + rand(fam, 2) * 9).toFixed(1) + '%');
      el.style.setProperty('--d1h', (3 + rand(fam, 3) * 8).toFixed(1) + 'vh');
      el.style.setProperty('--d2x', (58 + rand(fam, 4) * 26).toFixed(1) + '%');
      el.style.setProperty('--d2w', (6 + rand(fam, 5) * 6).toFixed(1) + '%');
      el.style.setProperty('--d2h', (1.5 + rand(fam, 6) * 4.5).toFixed(1) + 'vh');
    }
    el.setAttribute('aria-label', p[0] + ' ' + p[1] + (open ? ', the pioneer color, open its page' : ', still drying, not open yet'));
    var tag = document.createElement('span');
    tag.className = 'sw-tag';
    tag.textContent = open ? 'open →' : 'soon';
    var lbl = document.createElement('span');
    lbl.className = 'sw-lbl';
    var nm = document.createElement('span');
    nm.className = 'sw-name';
    nm.textContent = p[0];
    var hx = document.createElement('span');
    hx.className = 'sw-hex';
    hx.textContent = p[1];
    lbl.appendChild(nm);
    lbl.appendChild(hx);
    el.appendChild(tag);
    el.appendChild(lbl);
    if (open) {
      var live = document.createElement('span');
      live.className = 'sw-live';
      live.setAttribute('aria-hidden', 'true');
      el.appendChild(live);
    }
    grid.appendChild(el);
  });
  var cells = Array.prototype.slice.call(grid.children);

  // elastic grid: the focused color's column and row widen, so the swatch grows at full resolution
  var wide = window.matchMedia('(min-width: 721px)');
  var BASE_C = new Array(12).fill('1fr').join(' ');
  var BASE_R = new Array(6).fill('1fr').join(' ');
  var tracks = function (n, k, w) {
    var out = [];
    for (var j = 0; j < n; j++) {
      var d = Math.abs(j - k);
      out.push((d < w.length ? w[d] : w[w.length - 1]) + 'fr');
    }
    return out.join(' ');
  };
  var cur = -1;
  function focusCell(i) {
    if (i === cur) return;
    if (cur >= 0) cells[cur].classList.remove('is-on');
    cur = i;
    if (i >= 0) {
      cells[i].classList.add('is-on');
      if (wide.matches) {
        grid.style.gridTemplateColumns = tracks(12, Math.floor(i / 6), [3.1, 1.5, 1.05, 0.9]);
        grid.style.gridTemplateRows = tracks(6, i % 6, [2.6, 1.3, 0.85]);
      }
    } else {
      grid.style.gridTemplateColumns = BASE_C;
      grid.style.gridTemplateRows = BASE_R;
    }
    var p = P[i >= 0 ? i : COBALT];
    readout.style.setProperty('--rc', p[1]);
    readout.style.setProperty('--ri', ink(p));
    rName.textContent = p[0];
    rSub.textContent = p[1] + (i < 0 || i === COBALT ? ' · open now' : ' · still drying');
    if (i >= 0) { site.style.setProperty('--ambient', p[3]); } else { site.style.removeProperty('--ambient'); }
  }
  grid.addEventListener('pointerover', function (e) {
    var c = e.target.closest('.sw');
    if (c) focusCell(Number(c.dataset.i));
  });
  grid.addEventListener('pointerleave', function (e) {
    if (e.pointerType === 'mouse' || e.pointerType === 'pen') focusCell(-1);
  });
  grid.addEventListener('focusin', function (e) {
    var c = e.target.closest('.sw');
    if (c) focusCell(Number(c.dataset.i));
  });
  grid.addEventListener('focusout', function (e) {
    if (!grid.contains(e.relatedTarget)) focusCell(-1);
  });

  // the painted note for colors that are not open yet, always on one line
  var timer = null;
  var dock = toast.parentNode;
  function fitToast() {
    if (toast.hidden) return;
    toast.style.setProperty('--fit', '1');
    var cs = getComputedStyle(dock);
    var avail = dock.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var need = toast.offsetWidth;
    if (need <= avail) return;
    var f = Math.max(0.35, avail / need * 0.98);
    toast.style.setProperty('--fit', f.toFixed(3));
    var w = toast.offsetWidth;
    if (w > avail) toast.style.setProperty('--fit', Math.max(0.35, f * avail / w * 0.98).toFixed(3));
  }
  window.addEventListener('resize', fitToast);
  if (document.fonts) {
    if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', fitToast);
    try { document.fonts.load('400 34px "Caveat Brush"'); } catch (e) { }
  }
  grid.addEventListener('click', function (e) {
    var c = e.target.closest('button.sw');
    if (!c) return;
    var p = P[Number(c.dataset.i)];
    toast.style.setProperty('--tc', p[1]);
    toast.style.setProperty('--ti', ink(p));
    toastName.textContent = p[0];
    toast.hidden = false;
    fitToast();
    toast.classList.remove('play');
    void toast.offsetWidth;
    toast.classList.add('play');
    clearTimeout(timer);
    timer = setTimeout(function () { toast.hidden = true; }, 3400);
  });

  // the deck: wheel, swipe, keys and in-page links fade from one page to the next
  function makeDeck(deck, onChange) {
    var pages = Array.prototype.slice.call(deck.querySelectorAll(':scope > .page'));
    var idx = -1, lockUntil = 0, armed = true, acc = 0, lastWheel = 0;
    var canScroll = function (el, dir) {
      if (el.scrollHeight <= el.clientHeight + 2) return false;
      return dir > 0 ? el.scrollTop + el.clientHeight < el.scrollHeight - 2 : el.scrollTop > 2;
    };
    function go(n, instant) {
      n = Math.max(0, Math.min(pages.length - 1, n));
      if (n === idx) return;
      var prev = idx;
      idx = n;
      if (instant) deck.classList.add('no-anim');
      pages.forEach(function (p, i) {
        p.classList.toggle('is-active', i === n);
        p.classList.toggle('is-past', i < n);
        p.setAttribute('aria-hidden', i === n ? 'false' : 'true');
        p.inert = i !== n;
      });
      if (instant) { void deck.offsetWidth; deck.classList.remove('no-anim'); }
      if (prev >= 0 && pages[prev].contains(document.activeElement)) pages[n].focus({ preventScroll: true });
      if (!instant) lockUntil = performance.now() + 900;
      if (onChange) onChange(n, prev);
    }
    deck.addEventListener('wheel', function (e) {
      if (e.ctrlKey || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      var dir = e.deltaY > 0 ? 1 : -1;
      var now = performance.now();
      var gap = now - lastWheel;
      lastWheel = now;
      if (canScroll(pages[idx], dir)) { acc = 0; return; }
      e.preventDefault();
      if (gap > 200) { armed = true; acc = 0; }
      if (!armed || now < lockUntil) return;
      acc += e.deltaY;
      if (Math.abs(acc) >= 24) { armed = false; acc = 0; go(idx + dir); }
    }, { passive: false });
    var startY = null, edgeDown = false, edgeUp = false;
    deck.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) { startY = null; return; }
      startY = e.touches[0].clientY;
      edgeDown = !canScroll(pages[idx], 1);
      edgeUp = !canScroll(pages[idx], -1);
    }, { passive: true });
    deck.addEventListener('touchend', function (e) {
      if (startY === null) return;
      var dy = e.changedTouches[0].clientY - startY;
      startY = null;
      if (Math.abs(dy) < 50 || performance.now() < lockUntil) return;
      if (dy < 0 && edgeDown) go(idx + 1);
      else if (dy > 0 && edgeUp) go(idx - 1);
    }, { passive: true });
    document.addEventListener('keydown', function (e) {
      if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
      var t = e.target;
      if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
      var onControl = t && /^(BUTTON|A)$/.test(t.tagName);
      var k = e.key;
      var down = k === 'ArrowDown' || k === 'PageDown' || (k === ' ' && !e.shiftKey && !onControl);
      var up = k === 'ArrowUp' || k === 'PageUp' || (k === ' ' && e.shiftKey && !onControl);
      var ready = performance.now() >= lockUntil;
      if (down && !canScroll(pages[idx], 1)) { e.preventDefault(); if (ready) go(idx + 1); }
      else if (up && !canScroll(pages[idx], -1)) { e.preventDefault(); if (ready) go(idx - 1); }
      else if (k === 'Home' && !onControl) { e.preventDefault(); go(0); }
      else if (k === 'End' && !onControl) { e.preventDefault(); go(pages.length - 1); }
    });
    document.addEventListener('click', function (e) {
      var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
      if (!a) return;
      var id = a.getAttribute('href').slice(1);
      for (var i = 0; i < pages.length; i++) {
        if (pages[i].id === id) { e.preventDefault(); go(i); return; }
      }
    });
    var hash = (window.location.hash || '').slice(1);
    var start = 0;
    for (var i = 0; i < pages.length; i++) { if (hash && pages[i].id === hash) start = i; }
    go(start, true);
    return { go: go };
  }
  makeDeck(document.getElementById('deck'), function (n) {
    if (n !== 1) focusCell(-1);
  });
})();
</script>
</body>
</html>
