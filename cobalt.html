<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cobalt · a color company</title>
<meta name="description" content="cobalt, the first color application from a color company: a calm scroll where every page is one color and one soft tone, and it learns what you linger on.">
<link rel="canonical" href="https://acolorcompany.com/cobalt.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Space+Mono:wght@400;700&amp;family=Caveat+Brush&amp;display=swap">
<link rel="preload" href="assets/cobalt-swirl.webp" as="image">
<style>
/* layout: one full-screen page on a painted cobalt ground; scrolling past it fades the page and lifts the ground away to reveal the app demo */
:root{
  --canvas:#F4F2EC;
  --panel:#FFFCF6;
  --ink:#121014;
  --cobalt:#043ECD;
  --display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --body:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
  --hand:'Caveat Brush','Marker Felt','Segoe Print',cursive;
  --mono:'Space Mono',ui-monospace,Menlo,Consolas,monospace;
  --gl:max(clamp(16px,4vw,48px),env(safe-area-inset-left,0px));
  --gr:max(clamp(16px,4vw,48px),env(safe-area-inset-right,0px));
  --ease:cubic-bezier(.22,1,.36,1);
  --stroke-img:url(assets/stroke.webp);
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--canvas);color:#FFFFFF;font-family:var(--body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:inherit}
::selection{background:#FFE208;color:var(--ink)}
:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}

@keyframes flood{from{clip-path:circle(0px at 50% 380px)}to{clip-path:circle(4400px at 50% 380px)}}
@keyframes rise{from{opacity:0;transform:translateY(.3em);filter:blur(18px)}}
@keyframes fan{from{rotate:0deg;opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(12px)}}
@keyframes pop{from{transform:scale(0)}}
@keyframes flow{to{background-position:-560px -280px}}
@keyframes paint-on{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes nudge{0%,100%{transform:translateY(-3px)}50%{transform:translateY(6px)}}
@keyframes wobble{0%{rotate:0deg}25%{rotate:-2deg}60%{rotate:1.5deg}100%{rotate:0deg}}
@keyframes cycle{
0%,5%{background-color:#FF051F}
8.33%,13.33%{background-color:#FF6B04}
16.67%,21.67%{background-color:#FEA005}
25%,30%{background-color:#FFE208}
33.33%,38.33%{background-color:#C8FF09}
41.67%,46.67%{background-color:#0AFF57}
50%,55%{background-color:#0BFFE1}
58.33%,63.33%{background-color:#07BEFF}
66.67%,71.67%{background-color:#043ECD}
75%,80%{background-color:#7405FE}
83.33%,88.33%{background-color:#E206FE}
91.67%,96.67%{background-color:#FF0598}
100%{background-color:#FF051F}
}

/* the painted cobalt ground; the app demo opens under this same ground and lifts it away */
.site{position:relative;isolation:isolate;height:100%;background-color:var(--cobalt);background-image:url(assets/cobalt-ground-2x.webp);background-image:image-set(url(assets/cobalt-ground-1x.webp) 1x,url(assets/cobalt-ground-2x.webp) 2x);background-size:520px 520px;animation:flood 1.15s cubic-bezier(.7,0,.16,1) backwards}
.stage{position:relative;z-index:1;height:100%;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain}
.stage:focus,.stage:focus-visible{outline:none}
.pad{padding-left:var(--gl);padding-right:var(--gr)}
.dot{display:inline-block;width:.2em;height:.2em;margin-left:.06em;border-radius:50%;background:#FF051F;animation:pop .8s cubic-bezier(.34,1.56,.64,1) 1.2s both,cycle 16s linear 1.2s infinite}

.hero{position:relative;min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 24px;padding-block:20px}
.wordmark{display:inline-block;padding-block:8px;font:800 22px/28px var(--display);letter-spacing:-.035em;text-decoration:none}
/* the same button as the app demo */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;box-sizing:border-box;padding:0 16px;background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:6px;box-shadow:3px 3px 0 var(--ink);font:700 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;transition:translate .15s,box-shadow .15s}
.btn:hover{translate:-2px -2px;box-shadow:5px 5px 0 var(--ink);animation:wobble .5s ease}
.btn:active{translate:2px 2px;box-shadow:1px 1px 0 var(--ink)}

.hero-main{position:relative;flex:1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;align-content:flex-end;gap:32px 48px;padding-block:24px 40px}
.hero-left{display:flex;flex-direction:column;align-items:flex-start;gap:20px;min-width:0}
.badge{position:relative;display:inline-flex;align-items:center;height:62px;box-sizing:border-box;padding:0 58px 0 30px;margin-left:-6px;rotate:-3deg}
.badge-paint{position:absolute;inset:0;background:var(--stroke-img) center/100% 100% no-repeat,var(--canvas);background-blend-mode:hard-light;-webkit-mask:var(--stroke-img) center/100% 100% no-repeat;mask:var(--stroke-img) center/100% 100% no-repeat;animation:paint-on .7s cubic-bezier(.65,0,.2,1) 1.05s both}
.badge-text{position:relative;font:400 30px/1 var(--hand);white-space:nowrap;color:var(--cobalt);animation:fade .5s ease 1.4s both}
.title{margin:0;font:800 clamp(104px,20vw,330px)/.8 var(--display);letter-spacing:-.06em}
.letter{display:inline-block;background:#C3D1F4 url(assets/cobalt-swirl.webp) 0 0/560px 280px repeat;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:rise 1.1s cubic-bezier(.16,1,.3,1) both,flow 24s linear infinite}
.l1{animation-delay:.7s,-2s}
.l2{animation-delay:.78s,-6s}
.l3{animation-delay:.86s,-10s}
.l4{animation-delay:.94s,-14s}
.l5{animation-delay:1.02s,-18s}
.l6{animation-delay:1.1s,-21s}
.lede{margin:0;max-width:31ch;font:500 21px/1.4 var(--body);letter-spacing:-.005em;animation:fade .9s cubic-bezier(.16,1,.3,1) 1.35s both}
.details{display:flex;flex-direction:column;gap:12px;min-width:240px;padding-bottom:8px;animation:fade .9s cubic-bezier(.16,1,.3,1) 1.25s both}
.kicker{font:700 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.cur{font:400 48px/1 var(--hand)}
.dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font:400 14px/1.4 var(--mono)}
.dl dt{opacity:.75}
.dl dd{margin:0}
.fan{position:absolute;top:0;right:clamp(0px,4vw,64px);width:400px;height:300px;pointer-events:none}
.chip{position:absolute;left:calc(50% - 30px);bottom:18px;width:60px;height:270px;border-radius:10px;transform-origin:50% 93%;background-color:var(--c);background-image:url(assets/paint-2x.webp);background-image:image-set(url(assets/paint-1x.webp) 1x,url(assets/paint-2x.webp) 2x);background-size:300px 300px;background-blend-mode:hard-light;box-shadow:-8px 10px 24px -10px rgba(0,4,30,.5),inset 0 0 0 1px rgba(255,255,255,.14);animation:fan 1.1s cubic-bezier(.22,1.3,.36,1) both}
.chip:nth-child(2n){background-position:-100px -60px}
.chip:nth-child(3n){background-position:-200px -150px}
.rivet{position:absolute;left:calc(50% - 7px);bottom:30px;width:14px;height:14px;border-radius:50%;background:#FFFFFF;box-shadow:0 0 0 3px rgba(0,10,56,.35);animation:fade .6s ease 1.5s both}

/* the way on: scroll (or click) to the app */
.next-row{display:flex;justify-content:center;padding-bottom:22px}
.next{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 16px;text-decoration:none;animation:fade .9s cubic-bezier(.16,1,.3,1) 1.7s both}
.next-text{font:400 28px/1.1 var(--hand);white-space:nowrap}
.next svg{display:block;width:30px;height:30px;animation:nudge 1.6s ease-in-out infinite}
.next:hover .next-text{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}

/* leaving for the demo: the page fades up and away, and the cobalt ground stays for the demo to lift */
.is-leaving .hero{opacity:0;translate:0 -28px;transition:opacity .38s ease,translate .45s var(--ease)}

@media (min-width:721px) and (max-height:700px){
  .fan{scale:.72;transform-origin:100% 0}
}
@media (max-width:720px){
  .nav{padding-block:16px}
  .hero-main{gap:24px 32px;padding-block:12px 28px}
  .fan{position:relative;top:auto;right:auto;width:100%;height:200px;order:-1;scale:.9;transform-origin:50% 100%}
  .chip{left:calc(50% - 20px);width:40px;height:172px}
  .rivet{bottom:25px}
  .badge{height:54px;padding:0 50px 0 26px}
  .badge-text{font-size:27px}
  .lede{font-size:19px}
  .cur{font-size:40px}
  .next-row{padding-bottom:16px}
  .next-text{font-size:25px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="site" id="site">
<main class="stage" id="stage" tabindex="-1">
<div class="hero pad">
<nav class="nav">
<a class="wordmark" href="index.html">a color company<span class="dot" aria-hidden="true"></span></a>
<a class="btn" href="index.html#palette"><span aria-hidden="true">←</span> all colors</a>
</nav>
<div class="hero-main">
<div class="fan" id="fan" aria-hidden="true"><span class="rivet"></span></div>
<div class="hero-left">
<span class="badge"><span class="badge-paint"></span><span class="badge-text">pioneer color · no. 001</span></span>
<h1 class="title" aria-label="cobalt"><span class="letter l1" aria-hidden="true">c</span><span class="letter l2" aria-hidden="true">o</span><span class="letter l3" aria-hidden="true">b</span><span class="letter l4" aria-hidden="true">a</span><span class="letter l5" aria-hidden="true">l</span><span class="letter l6" aria-hidden="true">t</span></h1>
<p class="lede">the first color application from a color company, with more colors on the way.</p>
</div>
<div class="details">
<span class="kicker">the swatch</span>
<span class="cur">pure cobalt</span>
<dl class="dl">
<dt>hex</dt><dd>#043ECD</dd>
<dt>rgb</dt><dd>4 62 205</dd>
<dt>oklch</dt><dd>45% 0.225 263</dd>
</dl>
</div>
</div>
<div class="next-row">
<a class="next" id="to-demo" href="demo/index.html?from=cobalt"><span class="next-text">scroll to see the cobalt app</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v16M5 13l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
</div>
</div>
</main>
</div>

<script>
(function () {
  // the fan: cobalt from 85% white to 60% black
  var MIX = ['#D8E4FB', '#B2C9F5', '#8DAEEF', '#6892E7', '#396BDB', '#043ECD', '#0333AD', '#02288D', '#011D6F', '#011453', '#000A38'];
  var fan = document.getElementById('fan');
  MIX.forEach(function (c, i) {
    var chip = document.createElement('span');
    chip.className = 'chip';
    chip.style.setProperty('--c', c);
    chip.style.rotate = ((i - 5) * 11) + 'deg';
    chip.style.animationDelay = (0.75 + i * 0.05).toFixed(2) + 's';
    fan.insertBefore(chip, fan.lastElementChild);
  });

  // past the end of the page: the page fades, the cobalt ground stays, and the demo opens under the same ground
  var root = document.documentElement;
  var stage = document.getElementById('stage');
  var link = document.getElementById('to-demo');
  var leaving = false;
  function toDemo() {
    if (leaving) return;
    leaving = true;
    root.classList.add('is-leaving');
    var reduced = false;
    try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { }
    setTimeout(function () { window.location.href = link.getAttribute('href'); }, reduced ? 0 : 400);
  }
  window.addEventListener('pageshow', function () {
    leaving = false;
    root.classList.remove('is-leaving');
  });
  link.addEventListener('click', function (e) {
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    toDemo();
  });

  var atEnd = function () { return stage.scrollTop + stage.clientHeight >= stage.scrollHeight - 2; };
  // wheel: a fresh downward scroll at the end of the page leaves; momentum that reaches the end does not
  var armed = true, acc = 0, lastWheel = 0;
  stage.addEventListener('wheel', function (e) {
    if (e.ctrlKey || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    var now = performance.now();
    if (now - lastWheel > 200) { armed = true; acc = 0; }
    lastWheel = now;
    if (e.deltaY < 0) { acc = 0; return; }
    if (!atEnd()) { armed = false; acc = 0; return; }
    e.preventDefault();
    if (!armed) return;
    acc += e.deltaY;
    if (acc >= 30) toDemo();
  }, { passive: false });
  // touch: a swipe up that starts at the end of the page
  var startY = null, edge = false;
  stage.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { startY = null; return; }
    startY = e.touches[0].clientY;
    edge = atEnd();
  }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    if (startY === null) return;
    var dy = e.changedTouches[0].clientY - startY;
    startY = null;
    if (dy < -50 && edge) toDemo();
  }, { passive: true });
  // keys: down, page down and space scroll the page, then leave at its end
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target;
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    var onControl = t && /^(BUTTON|A)$/.test(t.tagName);
    var k = e.key;
    if (!(k === 'ArrowDown' || k === 'PageDown' || (k === ' ' && !e.shiftKey && !onControl))) return;
    e.preventDefault();
    if (atEnd()) toDemo();
    else stage.scrollBy({ top: k === 'ArrowDown' ? 120 : stage.clientHeight * 0.85, behavior: 'smooth' });
  });
})();
</script>
</body>
</html>
